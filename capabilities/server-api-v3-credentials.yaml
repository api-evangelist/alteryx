        - name: result
          type: object
          value: $.
        inputParameters:
        - name: view
          in: query
          type: string
        - name: userId
          in: query
          type: string
          description: Filter by user
        - name: userGroupId
          in: query
          type: string
          description: Filter by user group
      - name: createcredential
        method: POST
        description: Create a New Credential
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
