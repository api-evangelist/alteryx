naftiko: 1.0.0-alpha2
info:
  label: Alteryx Analytics Automation
  description: Analytics automation workflow combining Alteryx Server V3 API for workflow management, job execution, scheduling,
    user administration, credential management, and collection organization. Used by data analysts and server administrators
    to automate analytics pipelines.
  tags:
  - Alteryx
  - Analytics
  - Automation
  - Data Engineering
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    ALTERYX_SERVER_URL: ALTERYX_SERVER_URL
    ALTERYX_CLIENT_ID: ALTERYX_CLIENT_ID
    ALTERYX_CLIENT_SECRET: ALTERYX_CLIENT_SECRET
capability:
  consumes:
  - type: http
    namespace: alteryx-server
    baseUri: https://your-server.example.com/webapi
    description: Alteryx Server V3 administration API
    authentication:
      type: bearer
      token: '{{ALTERYX_CLIENT_SECRET}}'
    resources:
    - name: workflows
      path: /v3/workflows
      description: Workflow management
      operations:
      - name: upload-workflow
        method: POST
        description: Upload a new workflow package
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-workflows
        method: GET
        description: List workflows with filtering and pagination
        inputParameters:
        - name: name
          in: query
          type: string
          required: false
          description: Filter by workflow name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-workflow
        method: GET
        description: Get a specific workflow by ID
        inputParameters:
        - name: workflowId
          in: path
          type: string
          required: true
          description: Workflow identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-workflow
        method: PUT
        description: Update workflow metadata
        inputParameters:
        - name: workflowId
          in: path
          type: string
          required: true
          description: Workflow identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-workflow
        method: DELETE
        description: Delete a workflow
        inputParameters:
        - name: workflowId
          in: path
          type: string
          required: true
          description: Workflow identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: download-workflow-package
        method: GET
        description: Download a workflow package file
        inputParameters:
        - name: workflowId
          in: path
          type: string
          required: true
          description: Workflow identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-workflow-questions
        method: GET
        description: Get analytic app questions for a workflow
        inputParameters:
        - name: workflowId
          in: path
          type: string
          required: true
          description: Workflow identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-workflow-jobs
        method: GET
        description: Get jobs for a workflow
        inputParameters:
        - name: workflowId
          in: path
          type: string
          required: true
          description: Workflow identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-job
        method: POST
        description: Create and execute a workflow job
        inputParameters:
        - name: workflowId
          in: path
          type: string
          required: true
          description: Workflow identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: schedules
      path: /v3/schedules
      description: Schedule management
      operations:
      - name: create-schedule
        method: POST
        description: Create a new workflow schedule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-schedules
        method: GET
        description: List all schedules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-schedule
        method: GET
        description: Get a specific schedule
        inputParameters:
        - name: scheduleId
          in: path
          type: string
          required: true
          description: Schedule identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-schedule
        method: PUT
        description: Update a schedule
        inputParameters:
        - name: scheduleId
          in: path
          type: string
          required: true
          description: Schedule identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-schedule
        method: DELETE
        description: Delete a schedule
        inputParameters:
        - name: scheduleId
          in: path
          type: string
          required: true
          description: Schedule identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users
      path: /v3/users
      description: User management
      operations:
      - name: create-user
        method: POST
        description: Create a new user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-users
        method: GET
        description: List all users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-user
        method: GET
        description: Get a specific user
        inputParameters:
        - name: userId
          in: path
          type: string
          required: true
          description: User identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-user
        method: PUT
        description: Update user details
        inputParameters:
        - name: userId
          in: path
          type: string
          required: true
          description: User identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-user
        method: DELETE
        description: Delete a user
        inputParameters:
        - name: userId
          in: path
          type: string
          required: true
          description: User identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deactivate-user
        method: POST
        description: Deactivate a user account
        inputParameters:
        - name: userId
          in: path
          type: string
          required: true
          description: User identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: credentials
      path: /v3/credentials
      description: Credential management
      operations:
      - name: get-credentials
        method: GET
        description: List all credentials
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-credential
        method: POST
        description: Create a new credential
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-credential
        method: DELETE
        description: Delete a credential
        inputParameters:
        - name: credentialId
          in: path
          type: string
          required: true
          description: Credential identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: collections
      path: /v3/collections
      description: Collection management
      operations:
      - name: create-collection
        method: POST
        description: Create a new collection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-collections
        method: GET
        description: List all collections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-collection
        method: GET
        description: Get a specific collection
        inputParameters:
        - name: collectionId
          in: path
          type: string
          required: true
          description: Collection identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-collection
        method: DELETE
        description: Delete a collection
        inputParameters:
        - name: collectionId
          in: path
          type: string
          required: true
          description: Collection identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: alteryx-automation-api
    description: Unified REST API for Alteryx analytics automation.
    resources:
    - path: /v1/workflows
      name: workflows
      description: Workflow management
      operations:
      - method: GET
        name: list-workflows
        description: List all workflows
        call: alteryx-server.get-workflows
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: upload-workflow
        description: Upload a new workflow
        call: alteryx-server.upload-workflow
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/workflows/{workflowId}
      name: workflow-detail
      description: Individual workflow operations
      operations:
      - method: GET
        name: get-workflow
        description: Get workflow details
        call: alteryx-server.get-workflow
        with:
          workflowId: rest.workflowId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/schedules
      name: schedules
      description: Schedule management
      operations:
      - method: GET
        name: list-schedules
        description: List all schedules
        call: alteryx-server.get-schedules
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-schedule
        description: Create a new schedule
        call: alteryx-server.create-schedule
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users
      name: users
      description: User management
      operations:
      - method: GET
        name: list-users
        description: List all users
        call: alteryx-server.get-users
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/collections
      name: collections
      description: Collection management
      operations:
      - method: GET
        name: list-collections
        description: List all collections
        call: alteryx-server.get-collections
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: alteryx-automation-mcp
    transport: http
    description: MCP server for AI-assisted Alteryx analytics automation.
    tools:
    - name: list-workflows
      description: List all workflows on the Alteryx Server
      hints:
        readOnly: true
        openWorld: true
      call: alteryx-server.get-workflows
      outputParameters:
      - type: object
        mapping: $.
    - name: get-workflow
      description: Get details of a specific workflow
      hints:
        readOnly: true
      call: alteryx-server.get-workflow
      with:
        workflowId: tools.workflow_id
      outputParameters:
      - type: object
        mapping: $.
    - name: upload-workflow
      description: Upload a new workflow package
      hints:
        readOnly: false
      call: alteryx-server.upload-workflow
      outputParameters:
      - type: object
        mapping: $.
    - name: update-workflow
      description: Update workflow metadata
      hints:
        readOnly: false
        idempotent: true
      call: alteryx-server.update-workflow
      with:
        workflowId: tools.workflow_id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-workflow
      description: Delete a workflow
      hints:
        destructive: true
      call: alteryx-server.delete-workflow
      with:
        workflowId: tools.workflow_id
      outputParameters:
      - type: object
        mapping: $.
    - name: download-workflow
      description: Download a workflow package
      hints:
        readOnly: true
      call: alteryx-server.download-workflow-package
      with:
        workflowId: tools.workflow_id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-workflow-questions
      description: Get analytic app questions for a workflow
      hints:
        readOnly: true
      call: alteryx-server.get-workflow-questions
      with:
        workflowId: tools.workflow_id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-workflow-jobs
      description: Get execution jobs for a workflow
      hints:
        readOnly: true
      call: alteryx-server.get-workflow-jobs
      with:
        workflowId: tools.workflow_id
      outputParameters:
      - type: object
        mapping: $.
    - name: create-job
      description: Create and execute a workflow job
      hints:
        readOnly: false
      call: alteryx-server.create-job
      with:
        workflowId: tools.workflow_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-schedules
      description: List all workflow schedules
      hints:
        readOnly: true
      call: alteryx-server.get-schedules
      outputParameters:
      - type: object
        mapping: $.
    - name: create-schedule
      description: Create a new workflow schedule
      hints:
        readOnly: false
      call: alteryx-server.create-schedule
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-schedule
      description: Delete a workflow schedule
      hints:
        destructive: true
      call: alteryx-server.delete-schedule
      with:
        scheduleId: tools.schedule_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-users
      description: List all users on the server
      hints:
        readOnly: true
      call: alteryx-server.get-users
      outputParameters:
      - type: object
        mapping: $.
    - name: create-user
      description: Create a new user
      hints:
        readOnly: false
      call: alteryx-server.create-user
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user
      description: Get user details
      hints:
        readOnly: true
      call: alteryx-server.get-user
      with:
        userId: tools.user_id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-user
      description: Delete a user
      hints:
        destructive: true
      call: alteryx-server.delete-user
      with:
        userId: tools.user_id
      outputParameters:
      - type: object
        mapping: $.
    - name: deactivate-user
      description: Deactivate a user account
      hints:
        readOnly: false
      call: alteryx-server.deactivate-user
      with:
        userId: tools.user_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-credentials
      description: List all stored credentials
      hints:
        readOnly: true
      call: alteryx-server.get-credentials
      outputParameters:
      - type: object
        mapping: $.
    - name: create-credential
      description: Create a new credential
      hints:
        readOnly: false
      call: alteryx-server.create-credential
      outputParameters:
      - type: object
        mapping: $.
    - name: list-collections
      description: List all collections
      hints:
        readOnly: true
      call: alteryx-server.get-collections
      outputParameters:
      - type: object
        mapping: $.
    - name: create-collection
      description: Create a new collection
      hints:
        readOnly: false
      call: alteryx-server.create-collection
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-collection
      description: Delete a collection
      hints:
        destructive: true
      call: alteryx-server.delete-collection
      with:
        collectionId: tools.collection_id
      outputParameters:
      - type: object
        mapping: $.
