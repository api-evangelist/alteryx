naftiko: "1.0.0-alpha1"

info:
  label: "Alteryx Server V3"
  description: "Alteryx Server API V3 for managing workflows, schedules, users, user groups, credentials, collections, and server connections with OAuth 2 authentication."
  tags:
    - Alteryx
    - Analytics
    - Automation
    - Server
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      ALTERYX_SERVER_URL: ALTERYX_SERVER_URL
      ALTERYX_CLIENT_ID: ALTERYX_CLIENT_ID
      ALTERYX_CLIENT_SECRET: ALTERYX_CLIENT_SECRET

capability:
  consumes:
    - type: http
      namespace: alteryx-server
      baseUri: https://your-server.example.com/webapi
      description: "Alteryx Server V3 administration API"
      authentication:
        type: bearer
        token: "{{ALTERYX_CLIENT_SECRET}}"
      resources:
        - name: workflows
          path: /v3/workflows
          description: "Workflow management"
          operations:
            - name: upload-workflow
              method: POST
              description: "Upload a new workflow package"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-workflows
              method: GET
              description: "List workflows with filtering and pagination"
              inputParameters:
                - name: name
                  in: query
                  type: string
                  required: false
                  description: "Filter by workflow name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-workflow
              method: GET
              description: "Get a specific workflow by ID"
              inputParameters:
                - name: workflowId
                  in: path
                  type: string
                  required: true
                  description: "Workflow identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-workflow
              method: PUT
              description: "Update workflow metadata"
              inputParameters:
                - name: workflowId
                  in: path
                  type: string
                  required: true
                  description: "Workflow identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-workflow
              method: DELETE
              description: "Delete a workflow"
              inputParameters:
                - name: workflowId
                  in: path
                  type: string
                  required: true
                  description: "Workflow identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: download-workflow-package
              method: GET
              description: "Download a workflow package file"
              inputParameters:
                - name: workflowId
                  in: path
                  type: string
                  required: true
                  description: "Workflow identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-workflow-questions
              method: GET
              description: "Get analytic app questions for a workflow"
              inputParameters:
                - name: workflowId
                  in: path
                  type: string
                  required: true
                  description: "Workflow identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-workflow-jobs
              method: GET
              description: "Get jobs for a workflow"
              inputParameters:
                - name: workflowId
                  in: path
                  type: string
                  required: true
                  description: "Workflow identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-job
              method: POST
              description: "Create and execute a workflow job"
              inputParameters:
                - name: workflowId
                  in: path
                  type: string
                  required: true
                  description: "Workflow identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: schedules
          path: /v3/schedules
          description: "Schedule management"
          operations:
            - name: create-schedule
              method: POST
              description: "Create a new workflow schedule"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-schedules
              method: GET
              description: "List all schedules"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-schedule
              method: GET
              description: "Get a specific schedule"
              inputParameters:
                - name: scheduleId
                  in: path
                  type: string
                  required: true
                  description: "Schedule identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-schedule
              method: PUT
              description: "Update a schedule"
              inputParameters:
                - name: scheduleId
                  in: path
                  type: string
                  required: true
                  description: "Schedule identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-schedule
              method: DELETE
              description: "Delete a schedule"
              inputParameters:
                - name: scheduleId
                  in: path
                  type: string
                  required: true
                  description: "Schedule identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: users
          path: /v3/users
          description: "User management"
          operations:
            - name: create-user
              method: POST
              description: "Create a new user"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-users
              method: GET
              description: "List all users"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-user
              method: GET
              description: "Get a specific user"
              inputParameters:
                - name: userId
                  in: path
                  type: string
                  required: true
                  description: "User identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-user
              method: PUT
              description: "Update user details"
              inputParameters:
                - name: userId
                  in: path
                  type: string
                  required: true
                  description: "User identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-user
              method: DELETE
              description: "Delete a user"
              inputParameters:
                - name: userId
                  in: path
                  type: string
                  required: true
                  description: "User identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: deactivate-user
              method: POST
              description: "Deactivate a user account"
              inputParameters:
                - name: userId
                  in: path
                  type: string
                  required: true
                  description: "User identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: credentials
          path: /v3/credentials
          description: "Credential management"
          operations:
            - name: get-credentials
              method: GET
              description: "List all credentials"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-credential
              method: POST
              description: "Create a new credential"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-credential
              method: DELETE
              description: "Delete a credential"
              inputParameters:
                - name: credentialId
                  in: path
                  type: string
                  required: true
                  description: "Credential identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: collections
          path: /v3/collections
          description: "Collection management"
          operations:
            - name: create-collection
              method: POST
              description: "Create a new collection"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-collections
              method: GET
              description: "List all collections"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-collection
              method: GET
              description: "Get a specific collection"
              inputParameters:
                - name: collectionId
                  in: path
                  type: string
                  required: true
                  description: "Collection identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-collection
              method: DELETE
              description: "Delete a collection"
              inputParameters:
                - name: collectionId
                  in: path
                  type: string
                  required: true
                  description: "Collection identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: alteryx-server-api
      resources:
        - path: /v1/workflows
          name: workflows
          description: "Workflow management"
          operations:
            - method: GET
              name: list-workflows
              description: "List all workflows"
              call: "alteryx-server.get-workflows"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: alteryx-server-mcp
      transport: http
      tools:
        - name: list-workflows
          description: "List all workflows"
          hints:
            readOnly: true
          call: "alteryx-server.get-workflows"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-workflow
          description: "Get workflow details"
          hints:
            readOnly: true
          call: "alteryx-server.get-workflow"
          with:
            workflowId: "tools.workflow_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-job
          description: "Execute a workflow"
          hints:
            readOnly: false
          call: "alteryx-server.create-job"
          with:
            workflowId: "tools.workflow_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-users
          description: "List all users"
          hints:
            readOnly: true
          call: "alteryx-server.get-users"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-schedules
          description: "List all schedules"
          hints:
            readOnly: true
          call: "alteryx-server.get-schedules"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-collections
          description: "List all collections"
          hints:
            readOnly: true
          call: "alteryx-server.get-collections"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-credentials
          description: "List all credentials"
          hints:
            readOnly: true
          call: "alteryx-server.get-credentials"
          outputParameters:
            - type: object
              mapping: "$."
