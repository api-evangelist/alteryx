        description: Retrieve All Schedules
        call: server-api-v3-schedules.getschedules
        with:
          view: rest.view
          ownerId: rest.ownerId
          workflowId: rest.workflowId
          runsAfter: rest.runsAfter
          runsBefore: rest.runsBefore
