    baseUri: https://{serverHostname}/webapi
    description: Alteryx Server API V3 — Schedules business capability. Self-contained, no shared references.
    resources:
    - name: v3-schedules
      path: /v3/schedules
      operations:
      - name: createschedule
        method: POST
        description: Create a New Schedule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: getschedules
        method: GET
        description: Retrieve All Schedules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: view
          in: query
          type: string
          description: Level of detail in the response
        - name: ownerId
          in: query
          type: string
          description: Filter by schedule owner
        - name: workflowId
          in: query
          type: string
          description: Filter by associated workflow
        - name: runsAfter
          in: query
          type: string
          description: Filter schedules that run after this date (ISO 8601, max 45-day range)
        - name: runsBefore
          in: query
          type: string
          description: Filter schedules that run before this date (ISO 8601, max 45-day range)
