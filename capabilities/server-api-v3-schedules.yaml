        call: server-api-v3-schedules.patchschedule
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteschedule
        description: Delete a Schedule
        call: server-api-v3-schedules.deleteschedule
        outputParameters:
        - type: object
          mapping: $.
