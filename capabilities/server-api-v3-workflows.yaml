        method: GET
        description: Retrieve All Workflows
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: view
          in: query
          type: string
          description: Level of detail in the response
        - name: name
          in: query
          type: string
          description: Filter workflows by name
        - name: ownerId
          in: query
          type: string
          description: Filter workflows by owner ID
        - name: createdAfter
          in: query
          type: string
          description: Filter workflows created after this date (ISO 8601 format)
        - name: createdBefore
          in: query
