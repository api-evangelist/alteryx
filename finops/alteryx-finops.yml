principles:
  - name: Visibility
    description: Use the Alteryx Server admin and Analytics Cloud usage dashboards to see seat utilization,
      workflow run volume, and add-on capacity consumption. Reconcile against the annual subscription
      schedule.
  - name: Allocation
    description: Allocate seats and capacity across analytics teams using Alteryx role assignments and
      project-level chargeback dimensions.
  - name: Optimization
    description: Right-size seat counts at renewal (downgrade Full Creators to Basic where possible, increase
      Viewers for read-only consumption); evaluate add-on capacity utilization to avoid overprovisioning;
      consolidate workflows to reduce automation-capacity needs.
  - name: Accountability
    description: Analytics center-of-excellence or data-engineering leadership owns the contract; run
      quarterly utilization reviews against analytics outcomes.
