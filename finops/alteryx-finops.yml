description: 'FOCUS-aligned FinOps for Alteryx: tiered seat-based subscription pricing across Starter
  ($250 per user/month, annual billing), Professional, and Enterprise editions, with optional add-ons
  for automation capacity, dedicated data processing, and professional services. Three user roles - Viewer,
  Basic Creator, Full Creator - shape per-seat cost.'
