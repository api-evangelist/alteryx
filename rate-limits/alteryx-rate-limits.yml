specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Alteryx
providerId: alteryx
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Analytics
  - Automation
  - Data Engineering
  - Data Preparation
  - ETL
  - Rate Limiting
description: Alteryx Server / Cloud APIs (Gallery / Server REST API and Alteryx Analytics Cloud APIs)
  are tenant-scoped; rate limits are determined by the customer's deployment and capacity rather than
  a published per-tier policy. Public Alteryx documentation does not publish concrete per-second / per-minute
  numbers.
sources:
  - https://www.alteryx.com/pricing
  - https://help.alteryx.com
notes: No public TPS/RPM numbers. Reconcile per tenant deployment (Server topology / Analytics Cloud capacity).
responseCodes:
  throttled: 429
  unauthorized: 401
limits:
  - name: Server Tenant Capacity
    scope: tenant
    metric: varies
    limit: capacity-bound by Server deployment topology and worker count
  - name: Analytics Cloud Tenant Capacity
    scope: tenant
    metric: varies
    limit: capacity-bound by purchased Analytics Cloud edition and add-ons
policies:
  - name: OAuth 2.0 Authentication
    description: Server / Analytics Cloud APIs use OAuth 2.0; tokens are scoped to a user / app identity.
  - name: Backoff Strategy
    description: Implement exponential backoff with jitter on 429 responses; honor Retry-After when returned.
  - name: Capacity Planning
    description: Throughput scales with provisioned Server workers, Analytics Cloud edition, and any add-on
      automation capacity / dedicated data processing.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
