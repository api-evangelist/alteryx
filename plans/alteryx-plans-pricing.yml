specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Alteryx
providerId: alteryx
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Analytics
  - Automation
  - Data Engineering
  - Data Preparation
  - Data Science
  - ETL
  - Machine Learning
  - Predictive Analytics
description: Alteryx prices the analytics platform across three editions - Starter (published list price
  per Full Creator), Professional, and Enterprise (both contact-sales). Three user roles (Viewer, Basic
  Creator, Full Creator) plus optional add-ons (additional automation capacity, dedicated data processing,
  professional services) shape final cost. List pricing is per user/month, billed annually.
sources:
  - https://www.alteryx.com/pricing
plans:
  - id: alteryx-starter
    name: Starter Edition
    type: subscription
    description: Entry-level edition for small teams needing basic business analytics. Code-free data
      preparation, workflow sharing, file-source connectivity, and cloud deployment.
    entries:
      - label: Full Creator Seat
        description: Per-user monthly subscription, billed annually
        name: full_creator_seat
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '$250 per user/month (billed annually)'
        userMultiplied: true
    elements:
      - name: Code-Free Data Preparation
      - name: Workflow Sharing
      - name: File Source Connectivity
      - name: Cloud Deployment
  - id: alteryx-professional
    name: Professional Edition
    type: subscription
    description: For teams performing data analytics and reporting. Adds hybrid cloud/desktop options,
      advanced data prep, AI Copilot, 100+ data-source connectivity, automated insights, and cloud reporting
      on top of Starter capabilities.
    entries:
      - label: Subscription
        description: Custom-quoted subscription
        name: subscription
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Everything in Starter
      - name: Hybrid Cloud / Desktop
      - name: Advanced Data Prep
      - name: AI Copilot
      - name: 100+ Data Source Connectivity
      - name: Automated Insights
      - name: Cloud Reporting
      - name: Add-On Support (Automation Capacity, Dedicated Data Processing, Professional Services)
  - id: alteryx-enterprise
    name: Enterprise Edition
    type: enterprise
    description: For organizations operationalizing analytics with scale and flexibility. Adds automated
      scheduling, enterprise governance, analytics applications, and included viewer licenses on top of
      Professional capabilities.
    entries:
      - label: Subscription
        description: Custom-quoted enterprise subscription
        name: subscription
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: Viewer Licenses
        description: Included viewer licenses for sharing workflows and reports
        name: viewers
        type: subscription
        metric: seat
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: included
        userMultiplied: true
    elements:
      - name: Everything in Professional
      - name: Automated Scheduling
      - name: Enterprise Governance
      - name: Analytics Applications
      - name: Included Viewer Licenses
      - name: Add-On Support (Automation Capacity, Dedicated Data Processing, Professional Services)
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
